<!DOCTYPE html>
<html>
<head>
    <title>All Events</title>
</head>
<body>
    <h1>All Events</h1>

    {% if user.is_staff %}
        <a href="{% url 'event_add' %}">Add New Event</a>
    {% endif %}

    {% if events %}
        <ul>
            {% for event in events %}
                <li>
                    <a href="{% url 'event_detail' event.pk %}">{{ event.title }}</a> — {{ event.date_time|date:"M d, Y H:i" }}
                    
                    {% if user.is_staff %}
                        | <a href="{% url 'event_edit' event.pk %}">Edit</a>
                        | <a href="{% url 'event_delete' event.pk %}">Delete</a>
                    {% endif %}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No events found.</p>
    {% endif %}
</body>
</html>
